# Docker Compose for Local Development
# Use this for testing locally before deploying to Render

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: terrarium-db
    environment:
      POSTGRES_DB: terrarium
      POSTGRES_USER: terrarium
      POSTGRES_PASSWORD: terrarium_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrarium"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Job Queue
  redis:
    image: redis:7-alpine
    container_name: terrarium-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main API + Worker
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terrarium-api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://terrarium:terrarium_dev_password@postgres:5432/terrarium
      - REDIS_URL=redis://redis:6379
      - TERRARIUM_MODE=live
      - PREVIEW_BASE_URL=http://localhost:3001
      - SESSION_TIMEOUT_SECONDS=3600
      - IDLE_TIMEOUT_SECONDS=3600
      # Add your API keys here (or use .env file)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-anthropic.claude-sonnet-4-6}
      - TERRARIUM_MODEL_INTENT=${TERRARIUM_MODEL_INTENT:-gemini-3.5-flash-lite}
    volumes:
      # Mount Docker socket for sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
