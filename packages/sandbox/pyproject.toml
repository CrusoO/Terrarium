[project]
name = "terrarium-sandbox"
version = "0.0.0"
description = "Docker runner, health, sleep/wake — filled in P1-S3"
requires-python = ">=3.12"
dependencies = [
    "terrarium-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrarium_sandbox"]

[tool.uv.sources]
terrarium-contracts = { workspace = true }
