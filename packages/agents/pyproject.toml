[project]
name = "terrarium-agents"
version = "0.0.0"
description = "Intent, Code Generator, Editor, Self-Healing, Smart Match — filled in Phase 2/5"
requires-python = ">=3.12"
dependencies = [
    "terrarium-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrarium_agents"]

[tool.uv.sources]
terrarium-contracts = { workspace = true }
