[project]
name = "terrarium-contracts"
version = "0.0.0"
description = "Pydantic models matching PLAN.md frozen contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrarium_contracts"]
