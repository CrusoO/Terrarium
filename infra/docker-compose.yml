services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terrarium
      POSTGRES_PASSWORD: terrarium
      POSTGRES_DB: terrarium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrarium -d terrarium"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - terrarium

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - terrarium

  traefik:
    image: traefik:v3.6.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=terrarium-sandbox
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - terrarium
      - sandbox

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.app
    command: ["uvicorn", "terrarium_api.main:app", "--host", "0.0.0.0", "--port", "3001"]
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TERRARIUM_TEMPLATES_DIR: /app/packages/templates
      TERRARIUM_EXTRA_CA_FILE: /etc/terrarium/certs/zscaler-root.pem
    volumes:
      - ./certs:/etc/terrarium/certs:ro
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - terrarium
      - sandbox

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.app
    command: ["arq", "terrarium_api.worker.WorkerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TERRARIUM_TEMPLATES_DIR: /app/packages/templates
      TERRARIUM_SANDBOX_NETWORK: terrarium-sandbox
      TERRARIUM_EXTRA_CA_FILE: /etc/terrarium/certs/zscaler-root.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/etc/terrarium/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - terrarium

networks:
  terrarium:
    name: terrarium
  sandbox:
    name: terrarium-sandbox
    attachable: true

volumes:
  postgres_data:
