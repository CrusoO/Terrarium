[project]
name = "terrarium-relay"
version = "0.0.0"
description = "WhatsApp change-request relay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "terrarium-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrarium_relay"]

[tool.uv.sources]
terrarium-contracts = { workspace = true }
