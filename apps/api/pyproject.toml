[project]
name = "terrarium-api"
version = "0.0.0"
description = "Terrarium orchestration API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "redis>=5.2",
    "terrarium-contracts",
    "terrarium-agents",
    "terrarium-sandbox",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrarium_api"]

[tool.uv.sources]
terrarium-contracts = { workspace = true }
terrarium-agents = { workspace = true }
terrarium-sandbox = { workspace = true }
